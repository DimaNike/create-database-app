services:
  db23:
    hostname: database
    image: container-registry.oracle.com/database/free:latest
    environment:
      - ORACLE_PDB=<%= serviceName %>
      - ORACLE_PWD=oracle
      - DBHOST=database
    ports:
      - <%= databasePort %>:1521
    mem_limit: 4096m
    cpus: 4

  ords-node1:
    hostname: ords-node
    image: container-registry.oracle.com/database/ords:latest
    environment:
      - CONN_STRING=//database:1521/<%= serviceName %>
      - ORACLE_PWD=oracle
    volumes:
      - ./ords-config/ords/config:/etc/ords/config
      - ./ords-config/apex:/opt/oracle/apex
    ports:
      - 8080:8080   
    healthcheck:
      test: curl --noproxy "localhost" -f -k http://database:8080/ords/ || exit 1
      interval: 5s
      timeout: 1s
      start_period: 10s
      retries: 3
    depends_on:
      db23:
        condition: service_healthy